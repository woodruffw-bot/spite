[workspace]
members = ["crates/*"]
resolver = "3"
exclude = ["vendor/regress"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/woodruffw-bot/spite"
publish = false

[workspace.dependencies]
regress = { version = "=0.12.0", default-features = false, features = ["std", "utf16", "prohibit-unsafe", "index-positions"] }
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-always"] }
jiff-tzdb = "=0.1.8"
spite-bigint = { path = "crates/spite-bigint" }
spite-core = { path = "crates/spite-core" }
spite-heap = { path = "crates/spite-heap" }
spite-parser = { path = "crates/spite-parser" }
spite-runtime = { path = "crates/spite-runtime" }
insta = { version = "1.43", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

# Keep checks enabled while reducing test linking and exhaustive Unicode costs.
[profile.test]
debug = 1
lto = "off"
debug-assertions = true
overflow-checks = true

[profile.test.package.spite-core]
opt-level = 1

# Matching moved from Core to regress; keep its existing test optimization level.
[profile.test.package.regress]
opt-level = 1

# Exhaustive Test262 loops need optimized execution without relaxing checks.
[profile.conformance]
inherits = "dev"
opt-level = 2
debug = 0
debug-assertions = true
overflow-checks = true
incremental = false

[patch.crates-io]
regress = { path = "vendor/regress" }
