name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  INSTA_UPDATE: 'no'

jobs:
  test:
    name: Test ${{ matrix.suite }} (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, '1.99.0']
        suite: [workspace, test262]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - name: Run workspace tests and documentation examples
        if: matrix.suite == 'workspace'
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$TOOLCHAIN" test --workspace --locked
      - name: Run complete pinned Test262 corpus
        if: matrix.suite == 'test262'
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$TOOLCHAIN" test -p spite-test262 --profile conformance --test conformance --locked

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable xtask check
